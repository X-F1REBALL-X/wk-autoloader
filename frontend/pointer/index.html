<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WK Autoloader</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #0f172a;
      background: -webkit-linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
      color: #e2e8f0;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      min-height: 100%;
      text-align: center;
    }

    p {
      font-size: 1.375rem;
      line-height: 1.5;
      color: #94a3b8;
    }

    p.bad {
      color: #f87171;
    }
  </style>
</head>

<body>
  <main>
    <p id="status">Loading&hellip;</p>
  </main>

  <script>
    (function () {
      'use strict';

      var dir = '[[APP_DIR_PLACEHOLDER]]';
      var version = '[[VERSION_PLACEHOLDER]]';
      var statusEl = document.getElementById('status');
      /* Absolute live target - same host as param.json deeplinkUri / installer
         post-install open. Bypasses stale AppCache when :1022 is up. */
      var LIVE_APP = 'http://127.0.0.1:1022/app/' + dir + '/index.html';

      function fail() {
        statusEl.textContent = 'Unable to open. Run the installer again.';
        statusEl.className = 'bad';
      }

      function goCachedApp() {
        window.location.replace('/app/' + dir + '/index.html');
      }

      function goLiveApp() {
        window.location.replace(LIVE_APP);
      }

      function probeLiveServer() {
        var probe = new XMLHttpRequest();
        probe.open('GET', '/version', true);
        probe.timeout = 1500;
        probe.onload = function () {
          if (probe.status === 200) {
            goLiveApp();
          } else {
            fail();
          }
        };
        probe.onerror = probe.ontimeout = fail;
        probe.send();
      }

      /* Soft-gate: __complete__ (manifest last entry) proves AppCache is whole.
         On success use relative versioned path (offline OK). On fail/mismatch
         probe live /version - if :1022 is up, open live /app (absolute). */
      /* Prefer live :1022 when installer is still up (avoids half-filled AppCache 404). */
      var live = new XMLHttpRequest();
      live.open('GET', 'http://127.0.0.1:1022/version', true);
      live.timeout = 1200;
      live.onload = function () {
        if (live.status === 200) { goLiveApp(); return; }
        checkCached();
      };
      live.onerror = live.ontimeout = checkCached;
      function checkCached() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/app/' + dir + '/__complete__', true);
        xhr.timeout = 4000;
        xhr.onload = function () {
          var t = (xhr.responseText || '').trim();
          if (xhr.status === 200 && t === version) {
            goCachedApp();
          } else {
            fail();
          }
        };
        xhr.onerror = xhr.ontimeout = fail;
        xhr.send();
      }
      live.send();
    })();
  </script>
</body>

</html>
